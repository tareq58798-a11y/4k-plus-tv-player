<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
    a { color: #1268F3; } a:hover { color: #0B3FA0; }
    @keyframes llSpin { to { transform: rotate(360deg); } }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F2F8FF;">

  <svg viewBox="0 0 390 844" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;">
    <defs>
      <linearGradient id="llBg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFFFFF"></stop><stop offset="45%" stop-color="#EFF6FF"></stop><stop offset="100%" stop-color="#DFEDFA"></stop>
      </linearGradient>
      <radialGradient id="llG1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="{{warmGlow}}" stop-opacity="0.7"></stop><stop offset="100%" stop-color="{{warmGlow}}" stop-opacity="0"></stop>
      </radialGradient>
      <radialGradient id="llG2" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#9FCBFF" stop-opacity="0.45"></stop><stop offset="100%" stop-color="#9FCBFF" stop-opacity="0"></stop>
      </radialGradient>
      <filter id="llBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="46"></feGaussianBlur></filter>
    </defs>
    <rect width="390" height="844" fill="url(#llBg)"></rect>
    <g filter="url(#llBlur)">
      <ellipse cx="345" cy="150" rx="165" ry="120" fill="url(#llG1)"></ellipse>
      <ellipse cx="45" cy="640" rx="195" ry="155" fill="url(#llG2)"></ellipse>
    </g>
    <path d="M0 580 L60 512 L124 568 L188 498 L252 572 L312 520 L390 582 L390 844 L0 844 Z" fill="#FFFFFF" opacity="0.9"></path>
    <path d="M188 498 L206 520 L170 520 Z M60 512 L76 534 L44 534 Z" fill="#DFEBF6" opacity="0.9"></path>
    <path d="M0 640 L72 592 L142 636 L210 580 L284 638 L344 602 L390 646 L390 844 L0 844 Z" fill="#D3E5F4"></path>
  </svg>

  <div style="position: absolute; top: 64px; left: 28px; display: flex; flex-direction: column; gap: 1px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="46" height="38" viewBox="0 0 38 32" fill="none">
        <defs>
          <linearGradient id="llTv" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3E9BFF"></stop><stop offset="100%" stop-color="#1348B5"></stop></linearGradient>
          <linearGradient id="llPlay" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFC74A"></stop><stop offset="100%" stop-color="#F47A0E"></stop></linearGradient>
        </defs>
        <path d="M13 2 L19 7.5 L25 2" stroke="url(#llTv)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
        <rect x="2" y="8" width="34" height="22" rx="6" stroke="url(#llTv)" stroke-width="2.6"></rect>
        <path d="M15 13.5 L25.5 19 L15 24.5 Z" fill="url(#llPlay)"></path>
      </svg>
      <div style="font-size: 38px; font-weight: 800; letter-spacing: -1.2px; line-height: 1; background: linear-gradient(180deg, #5FBCFF 0%, #1E7BEE 48%, #0B3FA0 100%); -webkit-background-clip: text; background-clip: text; color: transparent;">4K</div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 6px; padding-left: 3px;">
      <div style="font-size: 16px; font-weight: 800; letter-spacing: 3px; color: #12283F;">PLUS</div>
      <div style="font-size: 16px; font-weight: 800; letter-spacing: 3px; background: linear-gradient(180deg, #FFB93A 0%, #ED7A0B 100%); -webkit-background-clip: text; background-clip: text; color: transparent;">TV</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 54%; display: flex; flex-direction: column; align-items: center; gap: 18px;">
    <div style="width: 42px; height: 42px; border-radius: 50%; border: 3px solid rgba(16,52,90,0.12); border-top-color: #1268F3; animation: llSpin 0.9s linear infinite;"></div>
    <div style="font-size: 14px; font-weight: 600; color: #3C5771;">Loading your playlist…</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 42px; text-align: center; font-size: 11px; font-weight: 500; color: #8FA6BC;">4K Plus TV Player</div>
</div>
</x-dc>
<script data-dc-script data-props='{"warmGlow":{"editor":"color","default":"#FFDDA6","options":["#FFDDA6","#FFD08A","#FFE8C4","#CFE8FF"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { warmGlow: this.props.warmGlow ?? '#FFDDA6' };
  }
}
</script>
</body>
</html>
